[package]
name = "crunch-cli"
version = "0.1.2"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Lossy PNG and JPEG compression: slimdeer, then Zopfli on PNG"
readme = "README.md"

[[bin]]
name = "crunch"
path = "src/main.rs"

[[bin]]
name = "crunch-bench"
path = "src/bin/crunch-bench.rs"

[dependencies]
libc = "0.2"
slimdeer = { path = "third_party/slimdeer", default-features = false, features = ["parallel", "oxipng", "jpeg"] }
rayon = "1"

[build-dependencies]
cc = "1"

# slimdeer's own patch applies only when that repository is the Cargo root.
[patch.crates-io]
fast-ssim2 = { path = "third_party/slimdeer/vendor/fast-ssim2" }
